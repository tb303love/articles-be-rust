[package]
name = "backend"   # Napomena: Ostavite "backend" kako bi se slagalo sa `members = ["backend"]` iz glavnog Workspace-a
version = "0.1.0"
edition = "2021"
authors = ["Darko Damljanovic"]
description = "Ogilenko server"

resolver = "2"

[dependencies]
# ==============================================================================
# 1. WEB SERVER & BEZBEDNOST (Actix Web ekosistem)
# ==============================================================================
actix-web = { version = "4.9", features = ["rustls-0_23"] }
actix-files = "0.6"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19.1"

# ==============================================================================
# 2. SSL / TLS PODRŠKA (Kriptografija i sertifikati)
# ==============================================================================
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# ==============================================================================
# 3. ASINHRONO PROGRAMIRANJE & PROCESIRANJE (Tokio & Futures)
# ==============================================================================
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3.32"

# ==============================================================================
# 4. SERIJALIZACIJA & SPECIJALIZOVANI TIPOVI (Podaci, Novac i Vreme)
# ==============================================================================
serde = { version = "1.0", features = ["derive"] }
bigdecimal = { version = "0.4", features = ["serde"] }  # Zamena za Java BigDecimal
chrono = { version = "0.4", features = ["serde"] }      # Zamena za Java LocalDate/LocalDateTime

# ==============================================================================
# 5. BAZA PODATAKA & KONFIGURACIJA (SQLx & Environment)
# ==============================================================================
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "mysql", "chrono", "bigdecimal" ] }
dotenvy = "0.15.7"

# ==============================================================================
# 6. LOGOVANJE & DIJAGNOSTIKA
# ==============================================================================
log = "0.4"
env_logger = "0.11"

# ==============================================================================
# 7. SAKCIONALNI ALATI (Windows Service integracija)
# ==============================================================================
windows-service = "0.8.1"
winreg = "0.56"
uuid = { version = "1.23.2", features = ["v4"] }

[package.metadata.wix]
defines = ["EnvSrc=.env.production"]
