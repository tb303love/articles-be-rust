[package]
name = "backend"
version = "0.1.0"
edition = "2021"
authors = ["Darko Damljanovic"]
description = "Ogilenko server"

resolver = "2"

[dependencies]
# ==============================================================================
# 1. WEB SERVER, WEBSOCKETS & BEZBEDNOST
# ==============================================================================
actix-web = { version = "4.9", features = ["rustls-0_23"] }
actix-files = "0.7.1"
actix-multipart = {version = "0.8.5"}
actix-ws = "0.4"  # ✅ DODATO: Moderni WebSockets
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
bcrypt = {version = "0.19.3"}

# ==============================================================================
# 2. SSL / TLS PODRŠKA (Kriptografija i sertifikati)
# ==============================================================================
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# ==============================================================================
# 3. ASINHRONO PROGRAMIRANJE & PROCESIRANJE (Tokio & Futures)
# ==============================================================================
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3.32"

# ==============================================================================
# 4. SERIJALIZACIJA & SPECIJALIZOVANI TIPOVI
# ==============================================================================
serde = { version = "1.0", features = ["derive"] }
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ==============================================================================
# 5. BAZA PODATAKA & KONFIGURACIJA
# ==============================================================================
# 🔧 FIKSIRANO: unificiran TLS na "tls-rustls"
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-rustls", "mysql", "chrono", "bigdecimal" ] }
dotenvy = "0.15.7"

# ==============================================================================
# 6. LOGOVANJE & DIJAGNOSTIKA
# ==============================================================================
log = "0.4"
flexi_logger = { version = "0.29", features = ["colors"] }
env_logger = "0.11"

# ==============================================================================
# 7. SPECIJALIZOVANI ALATI (Windows Service integracija)
# ==============================================================================
windows-service = "0.8.1"
winreg = "0.56"
uuid = { version = "1.23.2", features = ["v4"] }
serde_json = "1.0.150"

[package.metadata.wix]
defines = ["EnvSrc=.env.production"]
